<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Icynigma.ai Systems Rogue Intelligence IME logo</title>
  <desc id="desc">A violet orbital intelligence sigil with the IME identity at its center.</desc>
  <defs>
    <linearGradient id="violet" x1="70" y1="50" x2="440" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7aa7ff"/><stop offset=".48" stop-color="#a678f0"/><stop offset="1" stop-color="#ed9ac8"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="256" cy="256" r="226" fill="#111827" fill-opacity=".92" stroke="url(#violet)" stroke-width="5"/>
  <ellipse cx="256" cy="256" rx="184" ry="74" fill="none" stroke="url(#violet)" stroke-width="11" transform="rotate(-31 256 256)" filter="url(#glow)"/>
  <ellipse cx="256" cy="256" rx="184" ry="74" fill="none" stroke="#d9c8ff" stroke-opacity=".65" stroke-width="4" transform="rotate(31 256 256)"/>
  <path d="M129 322 L171 189 L218 310 L256 184 L302 310 L344 189 L382 322" fill="none" stroke="url(#violet)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="256" cy="256" r="24" fill="#10131b" stroke="#e3d4ff" stroke-width="7"/>
  <circle cx="256" cy="256" r="9" fill="#c9b3ff" filter="url(#glow)"/>
  <text x="256" y="410" text-anchor="middle" fill="#f4efff" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="700" letter-spacing="13">IME</text>
</svg>
